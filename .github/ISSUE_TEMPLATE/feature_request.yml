name: Feature request
description: A command, option or workflow you'd like the jira command to support.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: The task, in your words. Who does it, and how often?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: For example the Jira web UI, a script, or `jira api` calls. Commands you already use help a lot.
  - type: dropdown
    id: who
    attributes:
      label: Who runs it?
      options: [Me, at a terminal, A coding agent, A CI pipeline or script, Several of these]
