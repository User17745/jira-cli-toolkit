name: Native binaries and GitHub Releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compatibility:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python -m build --no-isolation
      - run: python scripts/smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release/binary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-native-${{ matrix.os }}
          path: dist/jira-cli-toolkit-*
          if-no-files-found: error
  attest:
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_ATTESTATIONS == 'true'
    needs: [compatibility, package, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m pip install --no-deps .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: python scripts/release/manifest.py
        env:
          RELEASE_ATTESTATIONS: 'true'
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release-assets/*'
  publish:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.compatibility.result == 'success' && needs.package.result == 'success' &&
      needs.native.result == 'success' &&
      (needs.attest.result == 'success' || needs.attest.result == 'skipped')
    needs: [compatibility, package, native, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m pip install --no-deps .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - run: python scripts/release/manifest.py
        env:
          RELEASE_ATTESTATIONS: ${{ vars.RELEASE_ATTESTATIONS }}
      - run: python scripts/release/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
