[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsup"
version = "0.3.0.dev0"
description = "General-purpose Jira Cloud CLI with a friendly terminal UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "rich>=13"]
authors = [{ name = "Abhishek Aggarwal" }]

[project.scripts]
jsup = "jsup.cli:main"
jira-cli-toolkit = "jsup.cli:toolkit_main"

[tool.hatch.build.targets.wheel]
packages = ["src/jsup"]
