[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "jsup"
version = "2.0.0rc1"
description = "General-purpose Jira Cloud CLI with a friendly terminal UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "rich>=13", "keyring>=25.6,<26", "packaging>=24"]
authors = [{ name = "Abhishek Aggarwal" }]

[project.urls]
Repository = "https://github.com/User17745/jira-cli-toolkit"
Issues = "https://github.com/User17745/jira-cli-toolkit/issues"

[dependency-groups]
dev = ["build==1.6.1", "hatchling==1.32.4", "pyinstaller==6.22.3"]

[project.scripts]
jsup = "jsup.cli:main"
jira-cli-toolkit = "jsup.cli:toolkit_main"

[tool.hatch.build.targets.wheel]
packages = ["src/jsup"]
